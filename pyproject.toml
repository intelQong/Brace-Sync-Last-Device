[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brace-sync-last-device"
version = "0.1.0"
description = "Encrypted recovery vault for Brave Sync last-device protection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
r2 = ["boto3>=1.34.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
brace-sync = "brace_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
